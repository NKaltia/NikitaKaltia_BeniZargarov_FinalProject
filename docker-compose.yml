services:
  db:
    image: postgres:latest
    container_name: drupal-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: my-secret-pw
      POSTGRES_DB: drupal
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - drupal-net
    restart: unless-stopped

  drupal:
    image: drupal:latest
    container_name: drupal-site
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - drupal-sites:/var/www/html/sites
    networks:
      - drupal-net
    restart: unless-stopped

networks:
  drupal-net:
    name: drupal-net

volumes:
  db-data:
    name: drupal-db-data
  drupal-sites:
    name: drupal-sites-data
